# =============================================================================
# CCAT API — Application Configuration
# =============================================================================
# Convention : sensitive values are NEVER hardcoded here.
# Override via environment variables (12-factor) or application-{profile}.properties.
#
# Required env vars in production:
#   DB_USERNAME, DB_PASSWORD
#   JWT_SECRET          (Base64, min 256-bit key)
#   MAIL_USERNAME, MAIL_PASSWORD
# =============================================================================

spring.application.name=ccatApi

# =============================================================================
# DATASOURCE
# =============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/cca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / HIBERNATE
# =============================================================================

# "update" is acceptable for development; use "validate" in production
# with an explicit migration tool (Flyway / Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Disabled — prevents DB connections leaking into the serialisation layer.
spring.jpa.open-in-view=false

# =============================================================================
# JWT
# =============================================================================

# Must be a Base64-encoded secret of at least 256 bits.
# Generate one: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Access token TTL  : 1 hour  (3 600 000 ms)
app.jwt.expiration-ms=3600000

# Refresh token TTL : 7 days  (604 800 000 ms)
app.jwt.refresh-expiration-ms=604800000

# =============================================================================
# MAIL
# =============================================================================

spring.mail.host=mail.buissite.com
spring.mail.port=465
spring.mail.username=contact@buissite.com
spring.mail.password=03Juin2002

# Port 465 = implicit SSL (SMTPS) — not STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.fallback=false

app.mail.from-address=contact@buissite.com
app.mail.from-name=CCAT

# Base URL used in email links (no trailing slash)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =============================================================================
# SPRINGDOC / SWAGGER UI
# =============================================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Disable Swagger in production — set SPRINGDOC_ENABLED=false via env var.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
