# =============================================================================
# CCAT API — Application Configuration
# =============================================================================
# NO credentials here. All sensitive values come from environment variables
# or application-local.properties (local dev, git-ignored).
# =============================================================================

spring.application.name=ccatApi
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# =============================================================================
# DATASOURCE
# =============================================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" in dev — switch to "validate" + Flyway/Liquibase in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# =============================================================================
# JWT
# =============================================================================

# Generate: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =============================================================================
# MAIL
# =============================================================================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.fallback=false

app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@localhost}
app.mail.from-name=${MAIL_FROM_NAME:CCAT}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =============================================================================
# ADMIN SEED
# =============================================================================

app.admin.email=${ADMIN_EMAIL:admin@localhost}
app.admin.password=${ADMIN_PASSWORD:change-me}

# =============================================================================
# SPRINGDOC / SWAGGER UI
# =============================================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# =============================================================================
# GOOGLE OAUTH
# =============================================================================
app.google.client-id=${GOOGLE_CLIENT_ID:}
