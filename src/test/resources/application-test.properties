# =============================================================================
# CCAT API - Test configuration (in-memory H2)
# =============================================================================

# H2 database
spring.datasource.url=jdbc:h2:mem:ccat_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (fixed test key, >= 256 bits in base64)
# Decodes to "ccat-test-jwt-secret-key-for-unit-and-integration-tests-only-2024"
app.jwt.secret=Y2NhdC10ZXN0LWp3dC1zZWNyZXQta2V5LWZvci11bml0LWFuZC1pbnRlZ3JhdGlvbi10ZXN0cy1vbmx5LTIwMjQ=
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Mail: NO spring.mail.host -> MailSenderAutoConfiguration does not activate
# The @MockitoBean JavaMailSender in IntegrationTestBase provides the required bean.
app.mail.from-address=no-reply@test.com
app.mail.from-name=CCAT Test

# Explicitly disable the mail health check as extra safety
management.health.mail.enabled=false

# URLs / admin
app.base-url=http://localhost:8080
app.admin.email=admin@test.com
app.admin.password=Admin1234!

# Google OAuth disabled
app.google.client-id=

# Swagger disabled in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
