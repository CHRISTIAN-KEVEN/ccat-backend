# =============================================================================
# CCAT API — Configuration de test (H2 en mémoire)
# =============================================================================

# ── Base de données H2 ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:ccat_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT (clé de test fixe, ≥ 256 bits en base64) ────────────────────────────
# Décode en "ccat-test-jwt-secret-key-for-unit-and-integration-tests-only-2024"
app.jwt.secret=Y2NhdC10ZXN0LWp3dC1zZWNyZXQta2V5LWZvci11bml0LWFuZC1pbnRlZ3JhdGlvbi10ZXN0cy1vbmx5LTIwMjQ=
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ── Mail : PAS de spring.mail.host → MailSenderAutoConfiguration ne se déclenche pas
# Le @MockitoBean JavaMailSender dans IntegrationTestBase fournit le bean nécessaire.
app.mail.from-address=no-reply@test.com
app.mail.from-name=CCAT Test

# Désactiver explicitement le health check mail (sécurité supplémentaire)
management.health.mail.enabled=false

# ── URLs / admin ─────────────────────────────────────────────────────────────
app.base-url=http://localhost:8080
app.admin.email=admin@test.com
app.admin.password=Admin1234!

# ── Google OAuth désactivé ───────────────────────────────────────────────────
app.google.client-id=

# ── Swagger désactivé en test ────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
